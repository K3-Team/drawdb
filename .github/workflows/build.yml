name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    # Runtime is Node 22 everywhere (the Nix package pins nodejs_22); no need to
    # matrix over older majors.
    - name: Use Node.js 22.x
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - name: Run oxlint
      run: npm run lint
    - name: Run tests
      run: npm test
    - name: Run server tests
      run: npm run test:server
    - name: Run import tests
      run: npm run test:import
    # The MCP SQL export tests import the bundled exporters; build them first.
    - name: Build MCP SQL vendor bundle
      run: npm run build:mcp-vendor
    - name: Run MCP tests
      run: npm run test:mcp
    - name: Run vite build
      run: npm run build

  # Nix flake checks: module eval, server/mcp/import/vitest suites, and the
  # NixOS VM test (needs KVM, available on ubuntu-latest runners).
  nix-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    # TODO: pin the two actions below to commit SHAs (repo action-pinning policy).
    - uses: DeterminateSystems/nix-installer-action@main
    # Nix store cache backed by GitHub Actions cache (no external service). Turns
    # the expensive rebuilds — better-sqlite3 compile, the vite package build,
    # the VM-test closure — into cache hits across runs. Keyed on the lockfiles
    # so it invalidates only when dependencies change.
    - uses: nix-community/cache-nix-action@v6
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'package-lock.json') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 5G
    - name: Run flake checks
      run: nix flake check -L
