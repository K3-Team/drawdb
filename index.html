<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Content-Security-Policy. Note: connect-src is restricted to 'self' plus
      the fixed GitHub-star host used on the landing page. A deployment that
      uses a CROSS-ORIGIN share/gist or bug-report backend (VITE_BACKEND_URL)
      must extend connect-src with that backend's origin, otherwise those
      axios calls will be blocked by the browser.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://api.github-star-counter.workers.dev; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <link rel="icon" href="/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Online database entity-relationship diagram editor, data modeler, and SQL generator. Design, visualize, and export scripts without an account and completely free of charge."
    />

    <meta name="robots" content="index,follow,max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://drawdb.app/" />
    <meta
      property="og:title"
      content="drawDB | Online database diagram editor and SQL generator"
    />
    <meta
      property="og:description"
      content="Online database entity-relationship diagram editor, data modeler, and SQL generator. Design, visualize, and export scripts without an account and completely free of charge."
    />
    <meta property="og:image" content="https://drawdb.app/hero_ss.png" />

    <link rel="apple-touch-icon" href="/favicon.ico" />

    <title>drawDB | Online database diagram editor and SQL generator</title>
  </head>
  <body theme-mode="light">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
